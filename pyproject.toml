[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_django = "django"
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/asgi.py" = ["E402"]
"config/settings/dev.py" = ["F403"]
"config/settings/prod.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405"]

[tool.bandit]
exclude_dirs = [
    "*/venv/*",
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/test_*.py",
    "*/*_tests.py",
    "*/staticfiles/*",
    "*/media/*",
    "*/backups/*",
]
skips = ["B101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--ds=config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*WindowsSelectorEventLoopPolicy.*:DeprecationWarning",
    "ignore:.*set_event_loop_policy.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["accounts", "audit", "chat", "config", "core", "demo", "realtime", "stats", "tickets"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92

# The contracts describe the intended layering. Test modules are ignored by
# wildcard because they intentionally build cross-app fixtures. The remaining
# explicit entries are the current production violations; later refactor
# phases shrink this list.
[tool.importlinter]
root_packages = [
    "accounts",
    "audit",
    "chat",
    "config",
    "core",
    "demo",
    "realtime",
    "stats",
    "tickets",
]

[[tool.importlinter.contracts]]
name = "core imports no other app"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["accounts", "tickets", "chat", "demo", "realtime", "stats", "audit"]
ignore_imports = [
    "core.tests.** -> **",
    "core.metrics -> stats.queries",
    "core.orphans -> accounts.models",
    "core.orphans -> tickets.models",
]

[[tool.importlinter.contracts]]
name = "accounts (except models) imports no higher app"
type = "forbidden"
source_modules = ["accounts"]
forbidden_modules = ["tickets", "chat", "demo", "realtime", "stats", "audit"]
ignore_imports = [
    "accounts.tests.** -> **",
    "accounts.admin -> realtime.events",
    "accounts.serializers -> realtime.events",
    "accounts.services -> realtime.events",
    "accounts.services -> tickets.assignment",
    "accounts.views -> realtime.events",
]

[[tool.importlinter.contracts]]
name = "tickets imports no higher app except chat models"
type = "forbidden"
source_modules = ["tickets"]
forbidden_modules = ["chat", "demo", "realtime", "stats", "audit"]
ignore_imports = [
    "tickets.tests.** -> **",
    "tickets.serializers -> chat.models",
    "tickets.assignment -> chat.assignment",
    "tickets.events -> realtime.events",
    "tickets.messages -> realtime.events",
]

[[tool.importlinter.contracts]]
name = "chat imports no higher app"
type = "forbidden"
source_modules = ["chat"]
forbidden_modules = ["realtime", "stats", "audit", "demo"]
ignore_imports = [
    "chat.tests.** -> **",
    "chat.assignment -> realtime.presence",
    "chat.assignment -> tickets.assignment",
    "chat.availability -> realtime.presence",
    "chat.conversations -> realtime.presence",
    "chat.offline -> realtime.events",
    "chat.offline -> realtime.presence",
    "chat.offline -> tickets.events",
    "chat.offline -> tickets.messages",
    "chat.widget.schema -> realtime.serializers",
    "chat.widget.schema -> tickets.serializers",
    "chat.widget.serializers -> tickets.serializers",
    "chat.widget.views -> realtime.tickets",
    "chat.contact -> tickets.events",
    "chat.conversations -> tickets.events",
    "chat.conversations -> tickets.messages",
    "chat.widget.views -> tickets.messages",
    "chat.widget.views -> tickets.serializers",
]

[[tool.importlinter.contracts]]
name = "realtime is a leaf"
type = "forbidden"
source_modules = ["realtime"]
forbidden_modules = ["stats", "audit", "demo"]
ignore_imports = [
    "realtime.tests.** -> **",
    "realtime.consumers -> core.metrics",
    "realtime.presence_consumer -> core.metrics",
]

[[tool.importlinter.contracts]]
name = "stats and audit are leaves"
type = "forbidden"
source_modules = ["stats", "audit"]
forbidden_modules = ["demo"]
ignore_imports = [
    "stats.tests.** -> **",
    "audit.tests.** -> **",
]
