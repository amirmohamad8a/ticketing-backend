name: ticketing

x-prod-app: &prod-app
  image: ticketing-backend:prod
  build:
    context: .
    target: prod
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  env_file:
    - .env
  environment:
    ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
    CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN}}
  restart: unless-stopped

services:
  migrate:
    <<: *prod-app
    restart: "no"

  web:
    <<: *prod-app
    command: ["sh", "-c", "exec daphne -b 0.0.0.0 -p ${PORT:-8000} --access-log /dev/null config.asgi:application"]
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *prod-app
    volumes:
      - media_data:/app/media

  beat:
    <<: *prod-app

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
    restart: unless-stopped

  redis:
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  media_data:
  caddy_data:
  caddy_config:
