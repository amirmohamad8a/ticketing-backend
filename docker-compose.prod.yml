name: ticketing

x-prod-app: &prod-app
  image: ticketing-backend:prod
  build:
    context: .
    target: prod
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  env_file:
    - .env
  restart: unless-stopped

services:
  migrate:
    <<: *prod-app
    restart: "no"

  web:
    <<: *prod-app
    command: ["sh", "-c", "exec daphne -b 0.0.0.0 -p ${PORT:-8000} --access-log /dev/null config.asgi:application"]
    ports:
      - "${WEB_PORT:-127.0.0.1:8000}:${PORT:-8000}"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *prod-app
    volumes:
      - media_data:/app/media

  beat:
    <<: *prod-app

  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
    restart: unless-stopped

  redis:
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  media_data:
