name: ticketing

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-prod-app: &prod-app
  image: ticketing-backend:prod
  build:
    context: .
    target: prod
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  env_file:
    - .env
  environment:
    ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
    CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN}}
    CACHE_REDIS_URL: redis://redis:6379/0
    BROKER_REDIS_URL: redis://broker:6379/1
    CHANNEL_REDIS_URL: redis://redis:6379/2
  restart: unless-stopped

services:
  migrate:
    <<: *prod-app
    restart: "no"
    logging: *json-logging

  web:
    <<: *prod-app
    command: ["sh", "-c", "exec daphne -b 0.0.0.0 -p ${PORT:-8000} --access-log /dev/null config.asgi:application"]
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *json-logging

  worker:
    <<: *prod-app
    volumes:
      - media_data:/app/media
    logging: *json-logging

  beat:
    <<: *prod-app
    logging: *json-logging

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *json-logging

  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
    restart: unless-stopped
    logging: *json-logging

  redis:
    restart: unless-stopped
    logging: *json-logging

  broker:
    volumes:
      - broker_data:/data
    restart: unless-stopped
    logging: *json-logging

volumes:
  broker_data:
  media_data:
  caddy_data:
  caddy_config:
