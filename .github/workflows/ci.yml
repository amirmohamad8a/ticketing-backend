name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 5 * * 1"

jobs:
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ticketing:ticketing@localhost:5432/ticketing
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS: "1"
      DJANGO_SETTINGS_MODULE: config.settings.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for Redis
        run: |
          python - <<'PY'
          import redis

          client = redis.Redis.from_url("redis://localhost:6379/0")
          assert client.ping()
          PY

      - name: Lint
        run: |
          black --check .
          isort --check-only .
          ruff check .

      - name: Check API schema
        run: |
          python manage.py spectacular --file schema.yml --validate --fail-on-warn
          git diff --exit-code -- schema.yml

      - name: Test
        run: pytest --cov

      - name: Check deployment settings
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-deploy-check-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          JWT_SIGNING_KEY: ci-deploy-check-jwt-signing-key-9876543210-zyxwvutsrqponmlk
          ALLOWED_HOSTS: support.example.com

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install security tools
        run: pip install -r requirements-security.txt

      - name: Static analysis (bandit)
        run: bandit -r . -c pyproject.toml --severity-level medium --confidence-level medium

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --no-deps --disable-pip
