            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
          description: ''
        '401':
          description: Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not allowed to perform this action.
