  /api/tickets/:
    get:
      operationId: tickets_list
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: مقدار نشانگر صفحه‌بندی.
        schema:
          type: string
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
          - urgent
        description: |-
          * `low` - Low
          * `medium` - Medium
          * `high` - High
          * `urgent` - Urgent
      - in: query
        name: status
        schema:
          type: string
          enum:
          - closed
          - in_progress
          - open
          - resolved
          - waiting_on_customer
        description: |-
          * `open` - Open
          * `in_progress` - In Progress
          * `waiting_on_customer` - Waiting on Customer
          * `resolved` - Resolved
          * `closed` - Closed
