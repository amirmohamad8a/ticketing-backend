openapi: 3.0.3
info:
  title: Ticketing API
  version: 1.0.0
  description: |-
    Support ticketing system API: tickets, comments, attachments, the chat widget, agent presence, statistics and the audit trail.

    Staff and customers authenticate with `Authorization: Bearer <access token>`. Widget visitors authenticate with the `X-Visitor-Token` header and must call from an origin listed in the site's `allowed_origins`.

    Every failed request returns the same envelope: `{"error": {"code": "...", "message": "...", "details": ...}}`. `details` holds the field errors of a validation error and is `null` otherwise. Clients should branch on `code` and never display `message`.

    WebSocket messages are not part of OpenAPI. They are described in `docs/realtime.md`.
