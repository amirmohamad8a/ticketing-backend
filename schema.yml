components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - id
      - name
      - role
    AgentLoad:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        open_chats:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - open_chats
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticket:
          type: integer
          readOnly: true
          nullable: true
        comment:
          type: integer
          readOnly: true
          nullable: true
        original_name:
          type: string
          readOnly: true
        download_url:
          type: string
          readOnly: true
        uploaded_by:
          type: integer
          readOnly: true
          nullable: true
        size:
          type: integer
          readOnly: true
        content_type:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - comment
      - content_type
      - created_at
      - download_url
      - id
      - original_name
      - size
      - ticket
      - uploaded_by
    AttachmentRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - file
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AuditKindEnum'
          readOnly: true
        ticket:
          type: integer
          readOnly: true
          nullable: true
        user:
          type: integer
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
          nullable: true
        field_changed:
          type: string
          readOnly: true
        old_value:
          type: string
          readOnly: true
        new_value:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_username
      - created_at
      - field_changed
      - id
      - kind
      - new_value
      - old_value
      - ticket
      - user
    AuditKindEnum:
      enum:
      - ticket
      - user
      type: string
      description: |-
        * `ticket` - ticket
        * `user` - user
    AuditPage:
      type: object
      properties:
        next:
          type: string
          format: uri
          readOnly: true
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
          readOnly: true
      required:
      - next
      - results
    CannedReply:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        shortcut:
          type: string
          maxLength: 32
        body:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - shortcut
      - title
      - updated_at
    CannedReplyRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        shortcut:
          type: string
          minLength: 1
          maxLength: 32
        body:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - body
      - shortcut
      - title
    ChannelCount:
      type: object
      properties:
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
        count:
          type: integer
          readOnly: true
      required:
      - channel
      - count
    ChannelEnum:
      enum:
      - portal
      - chat
      - offline_form
      type: string
      description: |-
        * `portal` - Portal
        * `chat` - Chat
        * `offline_form` - Offline form
    ColorEnum:
      enum:
      - gray
      - red
      - orange
      - yellow
      - green
      - teal
      - blue
      - purple
      - pink
      type: string
      description: |-
        * `gray` - Gray
        * `red` - Red
        * `orange` - Orange
        * `yellow` - Yellow
        * `green` - Green
        * `teal` - Teal
        * `blue` - Blue
        * `purple` - Purple
        * `pink` - Pink
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticket:
          type: integer
          readOnly: true
        author:
          type: integer
          readOnly: true
          nullable: true
        visitor:
          type: integer
          readOnly: true
          nullable: true
        sender_type:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        client_msg_id:
          type: string
          nullable: true
          maxLength: 64
        body:
          type: string
          maxLength: 4000
        is_internal:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - kind
      - sender_type
      - ticket
      - updated_at
      - visitor
    CommentRequest:
      type: object
      properties:
        client_msg_id:
          type: string
          nullable: true
          maxLength: 64
        body:
          type: string
          minLength: 1
          maxLength: 4000
        is_internal:
          type: boolean
      required:
      - body
    ConversationCreateRequest:
      type: object
      properties:
        site_key:
          type: string
          minLength: 1
          maxLength: 64
        body:
          type: string
          minLength: 1
          maxLength: 4000
        client_msg_id:
          type: string
          nullable: true
          maxLength: 64
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        pow_challenge:
          type: string
          maxLength: 512
        pow_nonce:
          type: string
          maxLength: 64
      required:
      - body
    DailyCount:
      type: object
      properties:
        date:
          type: string
          format: date
          readOnly: true
        count:
          type: integer
          readOnly: true
      required:
      - count
      - date
    DownloadLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        expires_in:
          type: integer
          readOnly: true
      required:
      - expires_in
      - url
    Error:
      type: object
      description: The envelope of every failed request.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable machine readable code, for example `validation_error`.
        message:
          type: string
          description: Human readable summary. Clients should not display it.
        details:
          nullable: true
          description: Field errors keyed by field name for a validation error, `null`
            for every other error.
          oneOf:
          - type: object
            additionalProperties: {}
          - type: array
            items: {}
      required:
      - code
      - message
      - details
    KindEnum:
      enum:
      - message
      - system
      type: string
      description: |-
        * `message` - Message
        * `system` - System
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    MeProfile:
      oneOf:
      - $ref: '#/components/schemas/Profile'
      - $ref: '#/components/schemas/StaffProfile'
    MessageList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
        has_more:
          type: boolean
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
      required:
      - has_more
      - results
      - unread_count
    OnlineAgent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
