components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - id
      - name
      - role
    ChannelEnum:
      enum:
      - portal
      - chat
      - offline_form
      type: string
      description: |-
        * `portal` - Portal
        * `chat` - Chat
        * `offline_form` - Offline form
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticket:
          type: integer
          readOnly: true
        author:
          type: integer
          readOnly: true
          nullable: true
        visitor:
          type: integer
          readOnly: true
          nullable: true
        sender_type:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        client_msg_id:
          type: string
          nullable: true
          maxLength: 64
        body:
          type: string
        is_internal:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - kind
      - sender_type
      - ticket
      - updated_at
      - visitor
    ConversationCreate:
      type: object
      properties:
        site_key:
          type: string
          maxLength: 64
        body:
          type: string
          maxLength: 4000
        client_msg_id:
          type: string
          nullable: true
          maxLength: 64
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - body
