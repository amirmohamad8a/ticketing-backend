x-dev-app: &dev-app
  build:
    context: .
    target: dev
  volumes:
    - .:/app
  env_file:
    - .env
  environment:
    DATABASE_URL: postgres://ticketing:ticketing@db:5432/ticketing
    CACHE_REDIS_URL: redis://redis:6379/0
    BROKER_REDIS_URL: redis://broker:6379/1
    CHANNEL_REDIS_URL: redis://redis:6379/2
    S3_ENDPOINT_URL: http://minio:9000
    CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  migrate:
    <<: *dev-app

  web:
    <<: *dev-app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *dev-app

  beat:
    <<: *dev-app

  # Frontend dev server. Expects the ticketing-frontend repo next to this one (../ticketing-frontend).
  frontend:
    image: ${NODE_IMAGE:-node:24-alpine}
    working_dir: /app
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm build &&
      pnpm --filter @ticketing/web dev --hostname 0.0.0.0 --port 3000"
    environment:
      API_INTERNAL_URL: http://web:8000
      API_PUBLIC_URL: http://localhost:8000
      PUBLIC_DOMAIN: localhost
      NEXT_PUBLIC_DEMO: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../ticketing-frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_web_modules:/app/apps/web/node_modules
      - frontend_shared_modules:/app/packages/shared/node_modules
      - frontend_widget_modules:/app/packages/widget/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - web

  db:
    environment:
      POSTGRES_PASSWORD: ticketing
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      BUCKET: ${S3_BUCKET_NAME:-ticketing}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${ACCESS_KEY} $${SECRET_KEY} &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc anonymous set none local/$${BUCKET}
      "

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    entrypoint: >
      /bin/sh -c "
      printf '%s' $${METRICS_TOKEN} > /tmp/metrics_token &&
      exec /bin/prometheus
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      "
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - web

volumes:
  minio_data:
  prometheus_data:
  frontend_node_modules:
  frontend_web_modules:
  frontend_shared_modules:
  frontend_widget_modules:
