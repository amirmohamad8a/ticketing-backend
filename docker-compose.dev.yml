x-dev-app: &dev-app
  build:
    context: .
    target: dev
  volumes:
    - .:/app
  env_file:
    - .env
  environment:
    DATABASE_URL: postgres://ticketing:ticketing@db:5432/ticketing
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000

services:
  migrate:
    <<: *dev-app

  web:
    <<: *dev-app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *dev-app

  beat:
    <<: *dev-app

  db:
    environment:
      POSTGRES_PASSWORD: ticketing
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      BUCKET: ${S3_BUCKET_NAME:-ticketing}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${ACCESS_KEY} $${SECRET_KEY} &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc anonymous set none local/$${BUCKET}
      "

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    entrypoint: >
      /bin/sh -c "
      printf '%s' $${METRICS_TOKEN} > /tmp/metrics_token &&
      exec /bin/prometheus
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      "
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - web

volumes:
  minio_data:
  prometheus_data:
