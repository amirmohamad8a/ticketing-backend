global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ticketing
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    dns_sd_configs:
      - names: ["web"]
        type: A
        port: 8000
