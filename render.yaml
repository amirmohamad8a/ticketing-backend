services:
  - type: keyvalue
    name: ticketing-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: ticketing-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketing-redis
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
